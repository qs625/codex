# 当前项目显式指定注入给模型的 instruction 文件。
# 统一读取 instructions 文件中的长期项目事实和用户偏好。
instruction_files = [
  "instructions/user-preferences.md",
  "instructions/project-understanding.md",
]

[memories]
compact_replacement_file_token_limit = 1500

[[memories.compact_replacement_files]]
path = "memory/current-work.md"
role = "current-work"

[[memories.compact_replacement_files]]
path = "instructions/project-understanding.md"
role = "project-understanding"

[[memories.compact_replacement_files]]
path = "instructions/user-preferences.md"
role = "user-preferences"

[mcp_servers.computer_use]
command = "node"
args = ["scripts/morpheus-computer-use-mcp.mjs"]
startup_timeout_sec = 5
tool_timeout_sec = 30
default_tools_approval_mode = "prompt"
