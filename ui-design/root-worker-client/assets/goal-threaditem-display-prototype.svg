  <text x="330" y="495" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Objective finished; GoalStrip may now collapse, but history remains here.</text>

  <circle cx="286" cy="567" r="15" fill="#f5f5f4" stroke="#d6d3d1"/>
  <path d="M279 567h14" stroke="#78716c" stroke-width="2" stroke-linecap="round"/>
