<svg width="1280" height="860" viewBox="0 0 1280 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Goal ThreadItem Display prototype</title>
  <desc id="desc">Root Worker Prototype conversation showing typed goal lifecycle event cells, with GoalStrip for current state and RightPanel for details.</desc>
  <rect width="1280" height="860" fill="#f7f5f1"/>
  <text x="28" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Prototype: goal lifecycle is a typed ThreadItem in conversation, not parsed assistant text.</text>

  <rect x="0" y="52" width="236" height="808" fill="#ebe7df"/>
  <text x="24" y="88" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#292524">Agent Tree</text>
  <rect x="18" y="116" width="200" height="48" rx="8" fill="#fffaf0" stroke="#e7d6af"/>
  <circle cx="40" cy="140" r="5" fill="#16a34a"/>
  <text x="56" y="137" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#292524">Root Agent</text>
  <text x="56" y="154" font-family="Inter, Arial, sans-serif" font-size="11" fill="#78716c">Idle · typed thread</text>

  <rect x="236" y="52" width="744" height="808" fill="#fcfbf8"/>
  <rect x="236" y="52" width="744" height="84" fill="#fffaf7" stroke="#eee6da"/>
  <text x="264" y="86" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#292524">/root / goal-threaditem-display</text>
  <text x="264" y="112" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78716c">Root Agent · Idle · run config default</text>

  <rect x="260" y="150" width="696" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="276" y="167" width="86" height="22" rx="11" fill="#ffedd5" stroke="#fdba74"/>
  <text x="290" y="182" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">Goal active</text>
  <text x="376" y="174" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#292524">Add typed goal ThreadItem display to conversation</text>
  <text x="376" y="191" font-family="Inter, Arial, sans-serif" font-size="11" fill="#78716c">Current state stays in GoalStrip; history stays in conversation.</text>
  <circle cx="929" cy="177" r="14" fill="#fff" stroke="#fed7aa"/>
  <path d="M924 177h10M929 172v10" stroke="#92400e" stroke-width="1.7" stroke-linecap="round"/>

