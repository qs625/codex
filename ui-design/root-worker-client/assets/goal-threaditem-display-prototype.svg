  <text x="330" y="403" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Add typed goal ThreadItem display to conversation.</text>

  <circle cx="286" cy="475" r="15" fill="#ecfdf5" stroke="#86efac"/>
  <path d="M279 476l5 5 10-12" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="310" y="446" width="520" height="70" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
