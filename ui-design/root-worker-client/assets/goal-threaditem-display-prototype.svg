  <text x="330" y="562" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#292524">Goal checked</text>
  <rect x="425" y="546" width="68" height="22" rx="11" fill="#f5f5f4"/>
  <text x="439" y="561" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#57534e">Read</text>
  <text x="777" y="562" font-family="Inter, Arial, sans-serif" font-size="11" fill="#a8a29e">10:50</text>
  <text x="330" y="587" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Internal reads should not flood conversation by default.</text>

  <rect x="260" y="748" width="696" height="82" rx="14" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="284" y="788" font-family="Inter, Arial, sans-serif" font-size="14" fill="#a8a29e">Message root agent...</text>
