  <text x="1040" y="179" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">Goal active</text>
  <text x="1026" y="213" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Full objective lives here, including budget and action controls.</text>
  <text x="1026" y="258" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">RECENT EVENT</text>
  <rect x="1026" y="276" width="206" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1040" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">Goal created · jump to item</text>

  <rect x="1006" y="382" width="248" height="96" rx="10" fill="#ffffff" stroke="#e7e0d4"/>
  <text x="1026" y="412" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#292524">Relationship</text>
  <text x="1026" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">GoalStrip = current state</text>
  <text x="1026" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Conversation = typed history</text>
  <rect x="1006" y="506" width="248" height="122" rx="10" fill="#ffffff" stroke="#e7e0d4"/>
  <text x="1026" y="536" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#292524">Responsive rules</text>
  <text x="1026" y="562" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Badge stays readable.</text>
  <text x="1026" y="582" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Title truncates before overlap.</text>
  <text x="1026" y="602" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57534e">Time can move to meta or aria.</text>
</svg>
