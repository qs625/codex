  <text x="324" y="321" font-family="Inter, Arial, sans-serif" font-size="11" fill="#a8a29e">You · 10:21</text>

  <circle cx="286" cy="383" r="15" fill="#fef3c7" stroke="#f59e0b"/>
  <path d="M286 375v16M278 383h16" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
