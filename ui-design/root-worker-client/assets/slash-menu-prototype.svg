<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Slash 菜单低保真原型</title>
  <desc id="desc">root-worker composer 输入 slash 后展示内置命令和 Skills 的分组候选菜单。</desc>
  <rect width="1280" height="820" fill="#f6f7f8"/>
  <rect x="24" y="24" width="262" height="772" rx="8" fill="#ffffff" stroke="#d8dde3"/>
  <text x="48" y="62" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Agent Tree</text>
  <rect x="48" y="92" width="214" height="52" rx="7" fill="#eef4ff" stroke="#c8d8f4"/>
  <text x="64" y="124" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1f2933">/root</text>
  <rect x="310" y="24" width="652" height="772" rx="8" fill="#ffffff" stroke="#d8dde3"/>
  <text x="338" y="62" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">/root</text>
  <rect x="338" y="104" width="572" height="74" rx="8" fill="#f9fafb" stroke="#e3e7eb"/>
  <text x="362" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#344054">Initial context injected</text>
  <text x="362" y="158" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085">Permissions • Skills • Environment</text>
  <rect x="338" y="208" width="572" height="70" rx="8" fill="#f9fafb" stroke="#e3e7eb"/>
  <text x="362" y="238" font-family="Inter, Arial, sans-serif" font-size="14" fill="#344054">Assistant message</text>
  <text x="362" y="260" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085">typed ThreadItem timeline</text>
  <g filter="url(#shadow)">
    <rect x="356" y="428" width="520" height="268" rx="8" fill="#ffffff" stroke="#cfd6dd"/>
  </g>
  <rect x="356" y="428" width="520" height="38" rx="8" fill="#f7f9fb"/>
  <text x="376" y="452" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#475467">COMMANDS</text>
  <rect x="368" y="478" width="496" height="44" rx="7" fill="#eaf2ff" stroke="#b7cff8"/>
  <text x="388" y="505" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">/clear</text>
  <text x="492" y="505" font-family="Inter, Arial, sans-serif" font-size="13" fill="#344054">归档当前会话并新建 root</text>
  <text x="814" y="505" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085" text-anchor="end">Enter</text>
  <rect x="368" y="530" width="496" height="40" rx="7" fill="#ffffff"/>
  <text x="388" y="555" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#98a2b3">Registry</text>
  <text x="492" y="555" font-family="Inter, Arial, sans-serif" font-size="13" fill="#98a2b3">后续命令由 registry 提供</text>
  <text x="376" y="596" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#475467">SKILLS</text>
  <rect x="368" y="610" width="496" height="40" rx="7" fill="#ffffff"/>
  <text x="388" y="635" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">$root-worker-playwright-debug</text>
  <text x="662" y="635" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">现有 chip/payload</text>
  <rect x="368" y="656" width="496" height="28" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="388" y="675" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9a3412">状态示例：No commands or skills match “/abc”</text>
  <rect x="334" y="718" width="604" height="54" rx="8" fill="#ffffff" stroke="#cfd6dd"/>
  <rect x="356" y="731" width="154" height="28" rx="14" fill="#eef6ff" stroke="#bfd7ff"/>
  <text x="374" y="750" font-family="Inter, Arial, sans-serif" font-size="12" fill="#175cd3">$imagegen</text>
  <text x="526" y="751" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1f2933">/comp</text>
  <text x="916" y="751" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085" text-anchor="end">Esc 关闭 • ↑↓ 选择 • Tab 补全</text>
  <rect x="986" y="24" width="270" height="772" rx="8" fill="#ffffff" stroke="#d8dde3"/>
  <text x="1012" y="62" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Thread Analysis</text>
  <rect x="1012" y="92" width="218" height="92" rx="8" fill="#f9fafb" stroke="#e3e7eb"/>
  <text x="1030" y="122" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#344054">Context</text>
  <text x="1030" y="150" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085">Slash menu 不改动右栏</text>
  <defs>
    <filter id="shadow" x="330" y="402" width="572" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101828" flood-opacity="0.14"/>
    </filter>
  </defs>
</svg>
