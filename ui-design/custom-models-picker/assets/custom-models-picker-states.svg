<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">自定义模型 picker 状态原型</title>
  <desc id="desc">展示 catalog model、configured custom model、当前模型不在 catalog、加载和错误状态。</desc>
  <rect width="1440" height="960" fill="#f6f7f9"/>
  <text x="72" y="82" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">模型 picker：catalog + configured custom models</text>
  <text x="72" y="118" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5b6472">轻量原型，用于说明列表排序、标记、未知当前模型和错误恢复，不替代真实 UI 规范。</text>

  <g transform="translate(72,154)">
    <rect x="0" y="0" width="1296" height="78" rx="6" fill="#ffffff" stroke="#d6dbe3"/>
    <text x="22" y="31" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#273244">Thread header</text>
    <rect x="970" y="17" width="278" height="44" rx="6" fill="#f9fafb" stroke="#cfd6df"/>
    <text x="988" y="35" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#273244">运行配置</text>
    <text x="988" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#606b7a">GPT-5.4 · High</text>
    <path d="M1233 34l6 6 6-6" fill="none" stroke="#606b7a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(72,282)">
    <rect x="0" y="0" width="400" height="558" rx="8" fill="#ffffff" stroke="#cfd6df"/>
    <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">A. 正常列表</text>
    <text x="22" y="61" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">Catalog models 在前，configured custom models 在后。</text>
    <text x="22" y="96" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#273244">模型</text>
    <text x="332" y="96" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7b8492">provider</text>

    <g transform="translate(18,112)">
      <rect width="364" height="72" rx="6" fill="#eef6ff" stroke="#6aa7e8"/>
      <circle cx="22" cy="34" r="8" fill="#2f80d1"/>
      <text x="40" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">GPT-5.4</text>
      <text x="40" y="50" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Catalog · 默认 High</text>
      <text x="285" y="40" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">openai</text>
    </g>
    <g transform="translate(18,194)">
      <rect width="364" height="72" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
      <circle cx="22" cy="34" r="8" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
      <text x="40" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">GPT-5.3 Codex Spark</text>
      <text x="40" y="50" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Catalog · 默认 Medium</text>
      <text x="285" y="40" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">openai</text>
    </g>
    <g transform="translate(18,276)">
      <rect width="364" height="80" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
      <circle cx="22" cy="38" r="8" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
      <text x="40" y="29" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">claude-sonnet-4.5</text>
      <text x="40" y="51" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Configured · 默认 Medium</text>
      <rect x="245" y="17" width="74" height="22" rx="4" fill="#f0f2f5" stroke="#d6dbe3"/>
      <text x="257" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Configured</text>
      <text x="247" y="60" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">anthropic</text>
    </g>
    <g transform="translate(18,366)">
      <rect width="364" height="80" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
      <circle cx="22" cy="38" r="8" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
      <text x="40" y="29" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">local-qwen-coder</text>
      <text x="40" y="51" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Configured · 默认 Low</text>
      <rect x="245" y="17" width="74" height="22" rx="4" fill="#f0f2f5" stroke="#d6dbe3"/>
      <text x="257" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Configured</text>
      <text x="257" y="60" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">ollama</text>
    </g>
    <text x="22" y="482" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#273244">Reasoning</text>
    <rect x="22" y="498" width="70" height="32" rx="5" fill="#ffffff" stroke="#d6dbe3"/>
    <text x="41" y="519" font-family="Inter, Arial, sans-serif" font-size="12" fill="#606b7a">Low</text>
    <rect x="102" y="498" width="86" height="32" rx="5" fill="#eef6ff" stroke="#6aa7e8"/>
    <text x="122" y="519" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d5f99">Medium</text>
    <rect x="198" y="498" width="76" height="32" rx="5" fill="#ffffff" stroke="#d6dbe3"/>
    <text x="222" y="519" font-family="Inter, Arial, sans-serif" font-size="12" fill="#606b7a">High</text>
  </g>

  <g transform="translate(520,282)">
    <rect x="0" y="0" width="400" height="558" rx="8" fill="#ffffff" stroke="#cfd6df"/>
    <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">B. 当前模型不在 catalog</text>
    <text x="22" y="61" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">打开 picker 保留当前选择，不自动回退。</text>
