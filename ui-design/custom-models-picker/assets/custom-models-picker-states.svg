      <circle cx="22" cy="42" r="8" fill="#cc8a19"/>
      <text x="40" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">my-private-model</text>
      <text x="40" y="50" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">当前配置 · 未出现在 model/list</text>
      <text x="40" y="71" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7a5b19">继续显示；只有用户选择其它项才改变。</text>
      <rect x="252" y="16" width="76" height="22" rx="4" fill="#fff0d4" stroke="#dfb35f"/>
      <text x="264" y="31" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a5b19">Current</text>
    </g>
    <g transform="translate(18,210)">
      <rect width="364" height="72" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
      <circle cx="22" cy="34" r="8" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
      <text x="40" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">GPT-5.4</text>
      <text x="40" y="50" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Catalog · 默认 High</text>
      <text x="285" y="40" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">openai</text>
    </g>
    <g transform="translate(18,292)">
      <rect width="364" height="80" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
      <circle cx="22" cy="38" r="8" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
      <text x="40" y="29" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">claude-sonnet-4.5</text>
      <text x="40" y="51" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6472">Configured · 默认 Medium</text>
      <rect x="245" y="17" width="74" height="22" rx="4" fill="#f0f2f5" stroke="#d6dbe3"/>
      <text x="257" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Configured</text>
    </g>
    <rect x="22" y="492" width="172" height="34" rx="5" fill="#ffffff" stroke="#d6dbe3"/>
    <text x="86" y="514" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">取消</text>
    <rect x="206" y="492" width="172" height="34" rx="5" fill="#2f80d1"/>
    <text x="279" y="514" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">应用</text>
  </g>

  <g transform="translate(968,282)">
    <rect x="0" y="0" width="400" height="558" rx="8" fill="#ffffff" stroke="#cfd6df"/>
    <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">C. 加载 / 错误 / 空状态</text>
    <text x="22" y="61" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">任何失败都不覆盖当前 thread 配置。</text>
    <g transform="translate(22,96)">
      <rect width="356" height="76" rx="6" fill="#f9fafb" stroke="#e1e5eb"/>
      <text x="18" y="31" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#273244">加载中</text>
      <text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">正在加载模型...</text>
    </g>
    <g transform="translate(22,194)">
      <rect width="356" height="104" rx="6" fill="#fff5f5" stroke="#e3a4a4"/>
      <text x="18" y="31" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">错误</text>
      <text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6472">模型列表加载失败，当前配置未受影响。</text>
      <rect x="272" y="64" width="64" height="26" rx="4" fill="#ffffff" stroke="#d6dbe3"/>
      <text x="290" y="82" font-family="Inter, Arial, sans-serif" font-size="12" fill="#273244">重试</text>
    </g>
    <g transform="translate(22,320)">
      <rect width="356" height="84" rx="6" fill="#f9fafb" stroke="#e1e5eb"/>
      <text x="18" y="31" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#273244">空结果</text>
      <text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">暂无可用模型，当前配置未受影响。</text>
    </g>
    <g transform="translate(22,430)">
      <rect width="356" height="92" rx="6" fill="#f8fbff" stroke="#b7cde7"/>
      <text x="18" y="31" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#273244">运行中限制</text>
      <text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#606b7a">当前 turn 正在运行，结束后可应用切换。</text>
      <rect x="258" y="58" width="78" height="26" rx="4" fill="#eef0f3" stroke="#d6dbe3"/>
      <text x="282" y="76" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8a93a0">应用</text>
    </g>
  </g>
