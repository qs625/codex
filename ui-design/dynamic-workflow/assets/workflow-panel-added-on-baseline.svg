<svg xmlns="http://www.w3.org/2000/svg" width="4216" height="2234" viewBox="0 0 4216 2234">
  <defs>
    <style>
      .ui { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #171717; }
      .section { font-size: 18px; font-weight: 700; fill: #555; letter-spacing: .04em; }
      .body { font-size: 18px; fill: #5f5a55; }
      .small { font-size: 15px; fill: #766f68; }
      .tiny { font-size: 13px; fill: #817a73; }
      .panel { fill: #fff; stroke: #e1dedb; stroke-width: 2; }
      .soft { fill: #f8f9fb; stroke: #e2e6ec; stroke-width: 2; }
      .green-box { fill: #ecfdf5; stroke: #22a56a; stroke-width: 2; }
      .blue-box { fill: #eff6ff; stroke: #3478f6; stroke-width: 2; }
      .muted-box { fill: #f5f5f5; stroke: #d7d3ce; stroke-width: 2; }
      .line { stroke: #c8ced8; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <!-- 当前真实 baseline 截图：原样保留，不重画、不替换任何现有 panel -->
  <image href="baseline-thread-empty.png" x="0" y="0" width="3456" height="2234" preserveAspectRatio="none"/>

  <!-- 新增右侧 Workflow Graph panel：追加到当前截图右侧 -->
  <rect x="3456" y="0" width="760" height="2234" fill="#fbfbfb"/>
  <line x1="3456" y1="0" x2="3456" y2="2234" stroke="#dedbd8" stroke-width="3"/>

  <g class="ui" transform="translate(3504 92)">
    <text class="section" x="0" y="0">WORKFLOW</text>
    <text class="title" x="0" y="44">Workflow Graph</text>
    <rect x="278" y="14" width="172" height="42" rx="21" fill="#dbeafe"/>
    <text x="306" y="42" font-size="18" font-weight="700" fill="#1d4ed8">waiting_agent</text>
    <text class="small mono" x="0" y="86">wf_123 · resumed · runtime nodes 5</text>

    <rect class="soft" x="0" y="126" width="664" height="112" rx="16"/>
    <text class="body" x="24" y="164">新增 panel，不替换 Thread Analysis</text>
    <text class="small" x="24" y="197">点击已运行 thread 节点：定位 Agent Tree，并打开 conversation</text>

    <!-- staticGraph / runtimeGraph -->
    <g transform="translate(0 300)">
      <rect class="green-box" x="0" y="0" width="214" height="78" rx="14"/>
      <text x="34" y="32" font-size="18" font-weight="700" fill="#076b43">Research</text>
      <text class="small" x="34" y="58">explorer · completed</text>

      <line class="line" x1="214" y1="39" x2="268" y2="39"/>
      <rect class="green-box" x="268" y="0" width="214" height="78" rx="14"/>
      <text x="302" y="32" font-size="18" font-weight="700" fill="#076b43">Implement</text>
      <text class="small" x="302" y="58">owner · completed</text>

      <line class="line" x1="375" y1="78" x2="375" y2="122"/>
      <path d="M375 122 l24 24 l-24 24 l-24 -24 z" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
      <text class="tiny" x="414" y="152">Branch observed</text>

      <line class="line" x1="375" y1="170" x2="375" y2="214"/>
      <rect class="blue-box" x="0" y="214" width="482" height="326" rx="18"/>
      <text x="28" y="254" font-size="20" font-weight="700" fill="#1e3a8a">Review/Fix loop</text>
      <text class="small" x="342" y="254">active</text>

      <rect class="panel" x="28" y="282" width="426" height="84" rx="12"/>
      <text class="small" x="52" y="314">Iteration 0</text>
      <circle cx="56" cy="342" r="8" fill="#22a56a"/>
      <text class="small" x="78" y="348">reviewer-0</text>
      <circle cx="264" cy="342" r="8" fill="#22a56a"/>
      <text class="small" x="286" y="348">fix-0</text>

      <rect x="28" y="390" width="426" height="96" rx="12" fill="#fff" stroke="#3478f6" stroke-width="4"/>
      <text class="small" x="52" y="424">Iteration 1</text>
      <circle cx="56" cy="458" r="9" fill="#3478f6"/>
      <text x="80" y="465" font-size="18" font-weight="700" fill="#171717">reviewer-1</text>
      <text class="small" x="330" y="465">running</text>

      <line class="line" x1="241" y1="540" x2="241" y2="590"/>
      <path d="M108 590 h266 M108 590 v44 M374 590 v44" stroke="#3478f6" stroke-width="3" fill="none"/>
      <text class="tiny" x="0" y="622">Parallel reviewer/test</text>
      <rect x="82" y="646" width="110" height="42" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="small" x="118" y="674">test</text>
      <rect x="290" y="646" width="110" height="42" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="small" x="316" y="674">review</text>
      <path d="M137 688 v34 M345 688 v34 M137 722 h208 M241 722 v48" stroke="#3478f6" stroke-width="3" fill="none"/>
      <text class="tiny" x="0" y="750">Join 1/2 completed</text>

      <rect class="muted-box" x="134" y="780" width="214" height="78" rx="14"/>
      <text x="188" y="812" font-size="18" font-weight="700" fill="#46413c">Verify</text>
      <text class="small" x="200" y="838">idle</text>
    </g>

    <g transform="translate(0 1248)">
      <rect class="panel" x="0" y="0" width="664" height="332" rx="18"/>
      <text class="title" x="28" y="52">Node details</text>
      <text class="body" x="28" y="94">reviewer-1 · agent · running</text>
      <text class="small mono" x="28" y="140">agentPath:</text>
      <text class="small mono" x="28" y="170">/root/project_pm/wf_123_reviewer_1</text>
      <text class="small" x="28" y="214">status source: existing thread/agent status</text>
      <rect x="28" y="248" width="162" height="48" rx="12" fill="#171717"/>
      <text x="57" y="279" font-size="17" font-weight="700" fill="#fff">Open thread</text>
      <rect x="210" y="248" width="188" height="48" rx="12" fill="#f7f7f7" stroke="#d6d3d0" stroke-width="2"/>
      <text x="238" y="279" font-size="17" font-weight="700" fill="#171717">Show in Tree</text>
      <rect x="418" y="248" width="144" height="48" rx="12" fill="#f7f7f7" stroke="#d6d3d0" stroke-width="2"/>
      <text x="452" y="279" font-size="17" font-weight="700" fill="#171717">Copy path</text>
    </g>
  </g>
</svg>
