[package]
edition.workspace = true
license.workspace = true
name = "command-service"
version.workspace = true

[lib]
name = "command_service"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
codex-approval-service-api = { workspace = true }
command-service-api = { workspace = true }
exec-server-api = { workspace = true }
codex-exec-server-protocol = { workspace = true }
codex-features = { workspace = true }
codex-file-system = { workspace = true }
hooks = { workspace = true }
hooks-api = { workspace = true }
metrics-api = { workspace = true }
codex-network-proxy-api = { workspace = true }
permissions-service = { workspace = true }
protocol = { workspace = true }
codex-sandboxing-api = { workspace = true }
session-telemetry-api = { workspace = true }
codex-shell-utils = { workspace = true }
thread-service-api = { workspace = true }
tool-config = { workspace = true }
codex-tool-service-api = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-output-truncation = { workspace = true }
codex-utils-path = { workspace = true }
codex-utils-pty = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
codex-windows-sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs", default-features = false }
