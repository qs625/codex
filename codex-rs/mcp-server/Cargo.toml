[package]
name = "codex-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-mcp-server"
path = "src/main.rs"

[lib]
name = "codex_mcp_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
approval-service = { workspace = true }
anyhow = { workspace = true }
codex-arg0 = { workspace = true }
codex-code-mode = { workspace = true }
plugin-service = { workspace = true }
skill-service = { workspace = true }
codex-exec-server = { workspace = true }
permissions-service = { workspace = true }
codex-extension-api = { workspace = true }
codex-features = { workspace = true }
hooks = { workspace = true }
goal-service = { workspace = true }
codex-login = { workspace = true, features = ["model-provider-auth"] }
memory-service = { workspace = true }
mcp-service = { workspace = true }
model-service = { workspace = true }
codex-network-proxy = { workspace = true }
codex-openai-files = { workspace = true }
codex-otel = { workspace = true }
codex-otel-init = { workspace = true }
protocol = { workspace = true }
rollout = { workspace = true }
codex-sandboxing = { workspace = true }
codex-shell-utils = { workspace = true }
state-api = { workspace = true }
command-service = { workspace = true }
thread-service-api = { workspace = true }
thread-service = { workspace = true }
codex-terminal-detection = { workspace = true }
thread-store = { workspace = true }
tool-config = { workspace = true }
codex-tool-service = { workspace = true }
codex-workflow = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-json-to-toml = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
codex-config-types = { workspace = true }
codex-utils-absolute-path = { workspace = true }
core_test_support = { workspace = true }
mcp_test_support = { workspace = true }
os_info = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
