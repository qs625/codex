[package]
edition.workspace = true
license.workspace = true
name = "codex-process-exec"
version.workspace = true

[lib]
name = "codex_process_exec"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chardetng = { workspace = true }
encoding_rs = { workspace = true }
codex-network-proxy-api = { workspace = true }
codex-protocol = { workspace = true }
codex-sandboxing-api = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-pty = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
