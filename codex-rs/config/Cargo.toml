[package]
name = "config-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
codex-agent-roles = { workspace = true }
codex-auth-types = { workspace = true }
command-service-api = { workspace = true }
codex-config-permissions = { workspace = true }
codex-config-requirements = { workspace = true }
codex-config-state = { workspace = true }
codex-config-toml = { workspace = true }
codex-config-types = { workspace = true }
plugin-service-api = { workspace = true }
skill-service-api = { workspace = true }
permissions-service-api = { workspace = true }
codex-features = { workspace = true }
codex-file-system = { workspace = true }
codex-git-info = { workspace = true }
hooks-api = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true, features = ["alloc", "std"] }
gethostname = { workspace = true }
mcp-types = { workspace = true }
memory-service-api = { workspace = true }
model-service-api = { workspace = true }
codex-network-proxy-api = { workspace = true }
protocol = { workspace = true }
rollout-api = { workspace = true }
codex-sandboxing-api = { workspace = true }
serde_ignored = { workspace = true }
serde_path_to_error = { workspace = true }
state-api = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt"] }
toml_edit = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
prost = "0.14.3"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["log"] }

[target.'cfg(unix)'.dependencies]
dns-lookup = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winapi-util = { workspace = true }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
assert_matches = { workspace = true }
permissions-service = { workspace = true }
model-service = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
dirs = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
doctest = false
