[package]
edition.workspace = true
license.workspace = true
name = "hooks"
version.workspace = true

[lib]
doctest = false
name = "hooks"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-analytics-api = { workspace = true }
codex-config-types = { workspace = true }
codex-context-manager = { workspace = true }
hooks-api = { workspace = true }
plugin-service-api = { workspace = true }
protocol = { workspace = true }
thread-service-api = { workspace = true }
codex-turn-items = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-output-truncation = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
config-service = { workspace = true }
hooks-api = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
