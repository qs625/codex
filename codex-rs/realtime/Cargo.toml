[package]
edition.workspace = true
license.workspace = true
name = "codex-realtime"
version.workspace = true

[lib]
name = "codex_realtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
codex-auth-types = { workspace = true }
transport-client-identity = { workspace = true }
codex-context-manager = { workspace = true }
codex-file-system = { workspace = true }
codex-git-info = { workspace = true }
model-service-api = { workspace = true }
protocol = { workspace = true }
thread-store-api = { workspace = true }
codex-user-info = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-output-truncation = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
codex-login = { workspace = true, features = ["model-provider-auth"] }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
