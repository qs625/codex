[package]
edition.workspace = true
license.workspace = true
name = "codex-realtime"
version.workspace = true

[lib]
name = "codex_realtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
codex-api-provider = { workspace = true }
codex-api-types = { workspace = true }
codex-auth-types = { workspace = true }
codex-client-identity = { workspace = true }
codex-model-client = { workspace = true }
codex-model-provider-api = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-protocol = { workspace = true }
codex-user-info = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
codex-login = { workspace = true, features = ["model-provider-auth"] }
pretty_assertions = { workspace = true }
