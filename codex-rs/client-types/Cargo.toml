[package]
name = "codex-client-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight Codex HTTP client request, error, and retry types."

[lib]
name = "codex_client_types"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
body-compression = ["dep:tracing", "dep:zstd"]

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
