[package]
edition.workspace = true
license.workspace = true
name = "thread-service"
version.workspace = true

[lib]
name = "thread_service"
path = "src/lib.rs"

[[example]]
name = "thread-service-sample"
path = "examples/thread_service_sample.rs"
required-features = ["test-support"]

[lints]
workspace = true

[features]
default = []
test-support = [
    "approval-service",
    "config-service/test-support",
    "codex-exec-server",
    "codex-login",
    "codex-network-proxy",
    "skill-service",
    "state",
    "thread-store",
    "codex-workflow",
]

[dependencies]
anyhow = { workspace = true }
app-server-protocol = { workspace = true }
async-channel = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-approval-service-api = { workspace = true }
approval-service = { workspace = true, optional = true }
codex-analytics-api = { workspace = true }
codex-agent-runtime = { workspace = true }
codex-agent-roles = { workspace = true }
codex-apply-patch = { workspace = true }
codex-async-utils = { workspace = true }
codex-auth-types = { workspace = true }
transport-client = { workspace = true }
codex-code-mode-api = { workspace = true }
command-service = { workspace = true }
command-service-api = { workspace = true }
compact-service = { workspace = true }
compact-service-api = { workspace = true }
transport-client-identity = { workspace = true }
transport-client-types = { workspace = true }
config-service = { workspace = true }
codex-connectors-api = { workspace = true }
codex-config-permissions = { workspace = true }
codex-config-toml = { workspace = true }
codex-config-types = { workspace = true }
codex-context-manager = { workspace = true }
codex-context-usage = { workspace = true }
plugin-service-api = { workspace = true }
skill-service-api = { workspace = true }
skill-service = { workspace = true, optional = true }
codex-exec-server-protocol = { workspace = true }
exec-server-api = { workspace = true }
codex-exec-server = { workspace = true, optional = true }
codex-extension-api = { workspace = true }
codex-features = { workspace = true }
codex-feedback-api = { workspace = true }
codex-file-subscription = { workspace = true }
codex-login = { workspace = true, optional = true, features = ["model-provider-auth"] }
memory-service-api = { workspace = true }
mcp-service = { workspace = true }
mcp-service-api = { workspace = true }
mcp-types = { workspace = true }
metrics-api = { workspace = true }
codex-model-input = { workspace = true }
model-service = { workspace = true }
model-service-api = { workspace = true }
codex-shell-utils = { workspace = true }
permissions-service-api = { workspace = true }
codex-file-system = { workspace = true }
codex-git-info = { workspace = true }
codex-guardian = { workspace = true }
hooks = { workspace = true }
hooks-api = { workspace = true }
goal-service = { workspace = true }
goal-service-api = { workspace = true }
state-api = { workspace = true }
codex-network-proxy = { workspace = true, optional = true }
codex-network-proxy-api = { workspace = true }
codex-openai-files-api = { workspace = true }
codex-otel = { workspace = true }
permissions-service = { workspace = true }
session-telemetry-api = { workspace = true }
protocol = { workspace = true }
codex-realtime = { workspace = true }
rollout-trace-api = { workspace = true }
rollout-api = { workspace = true }
codex-sandboxing = { workspace = true }
codex-sandboxing-api = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
state = { workspace = true, optional = true }
thread-service-api = { workspace = true }
