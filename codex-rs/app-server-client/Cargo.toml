[package]
name = "app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
test-support = ["thread-service/test-support"]

[dependencies]
config-service = { workspace = true }
app-server = { workspace = true }
app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
thread-service = { workspace = true }
permissions-service = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
mcp-service = { workspace = true }
codex-otel-init = { workspace = true }
protocol = { workspace = true }
codex-sandboxing = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rollout = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
