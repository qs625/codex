[package]
edition.workspace = true
license.workspace = true
name = "codex-thread-runtime"
version.workspace = true

[lib]
name = "codex_thread_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
test-support = [
    "codex-api",
    "codex-config/test-support",
    "codex-config-local-loader",
    "codex-default-client",
    "codex-exec-server",
    "codex-login",
    "codex-mcp",
    "codex-models-manager",
    "codex-network-proxy",
    "codex-core-skills",
    "codex-state",
    "codex-thread-store",
    "codex-workflow",
]

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
