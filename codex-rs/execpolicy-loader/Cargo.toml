[package]
name = "codex-execpolicy-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Starlark-backed exec policy loader for Codex composition roots."

[lib]
name = "codex_execpolicy_loader"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-config-state = { workspace = true }
codex-config-types = { workspace = true }
codex-execpolicy = { workspace = true }
codex-execpolicy-api = { workspace = true }
codex-permissions-runtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
anyhow = { workspace = true }
codex-config = { workspace = true, features = ["test-support"] }
codex-config-loader = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
toml = { workspace = true }
which = { workspace = true }
