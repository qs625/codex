[package]
edition.workspace = true
license.workspace = true
name = "codex-model-client"
version.workspace = true

[lib]
name = "codex_model_client"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-api-provider = { workspace = true }
codex-api-runtime-api = { workspace = true }
codex-api-types = { workspace = true }
codex-auth-types = { workspace = true }
codex-client-types = { workspace = true }
codex-client-identity = { workspace = true }
codex-feedback-api = { workspace = true }
codex-model-provider-api = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-protocol = { workspace = true }
codex-rollout-trace-api = { workspace = true }
codex-session-telemetry-api = { workspace = true }
codex-tool-planning = { workspace = true }
codex-trace-context = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
anyhow = { workspace = true }
codex-api = { workspace = true }
codex-login = { workspace = true, features = ["model-provider-auth"] }
codex-models-manager-api = { workspace = true }
codex-otel = { workspace = true }
codex-rollout-trace = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
