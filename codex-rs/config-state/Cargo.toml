[package]
edition.workspace = true
license.workspace = true
name = "codex-config-state"
version.workspace = true
description = "Lightweight configuration layer stack state shared across Codex crates."

[lib]
doctest = false
name = "codex_config_state"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-config-diagnostics = { workspace = true }
codex-config-edit = { workspace = true }
codex-config-requirements = { workspace = true }
codex-config-types = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
