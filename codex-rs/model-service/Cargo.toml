[package]
name = "model-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Concrete model service implementation."

[lib]
name = "model_service"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
