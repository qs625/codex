codex-login = { workspace = true }
codex-realtime = { workspace = true }
codex-collaboration-mode-templates = { workspace = true }
codex-otel = { workspace = true }
codex-tool-service-api = { workspace = true }
codex-utils-output-truncation = { workspace = true }
codex-utils-template = { workspace = true }
bytes = { workspace = true }
eventsource-stream = { workspace = true }
protocol = { workspace = true }
regex-lite = { workspace = true }
rollout-trace-api = { workspace = true }
session-telemetry-api = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
