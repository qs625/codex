[package]
name = "codex-config-local-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local filesystem config layer loader for Codex."

[lib]
doctest = false
name = "codex_config_local_loader"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
codex-config-diagnostics = { workspace = true }
codex-config-loader = { workspace = true }
codex-config-requirements = { workspace = true }
codex-config-state = { workspace = true }
codex-config-toml = { workspace = true }
codex-config-types = { workspace = true }
codex-features = { workspace = true }
codex-file-system = { workspace = true }
codex-git-info = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
dunce = { workspace = true }
gethostname = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_path_to_error = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
dns-lookup = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winapi-util = { workspace = true }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
