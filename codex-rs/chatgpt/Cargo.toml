[package]
name = "codex-chatgpt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
codex-auth-types = { workspace = true }
codex-config-types = { workspace = true }
codex-connectors = { workspace = true }
codex-connectors-api = { workspace = true }
thread-service = { workspace = true, optional = true }
plugin-service = { workspace = true }
plugin-service-api = { workspace = true }
codex-git-utils = { workspace = true, optional = true }
codex-login = { workspace = true }
codex-model-provider = { workspace = true }
codex-utils-cli = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }

[features]
default = []
apply-command = ["clap", "thread-service", "codex-git-utils", "codex-utils-cli"]

[[test]]
name = "all"
path = "tests/all.rs"
required-features = ["apply-command"]

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lib]
doctest = false
