[package]
edition.workspace = true
license.workspace = true
name = "codex-core-skills"
version.workspace = true

[lib]
doctest = false
name = "codex_core_skills"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
remote-http = [
    "codex-api-auth",
    "codex-auth-types",
    "codex-default-client",
    "zip",
]

[dependencies]
anyhow = { workspace = true }
codex-api-auth = { workspace = true, optional = true }
codex-auth-types = { workspace = true, optional = true }
codex-core-skills-api = { workspace = true }
codex-config-types = { workspace = true }
codex-default-client = { workspace = true, optional = true }
codex-file-system = { workspace = true }
codex-metrics-api = { workspace = true }
plugin-service-api = { workspace = true }
codex-protocol = { workspace = true }
codex-skills = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
toml = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
codex-config = { workspace = true }
dunce = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
