[package]
name = "codex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "codex"
path = "src/main.rs"

[lib]
name = "codex_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
config-service = { workspace = true }
approval-service = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
app-server = { workspace = true }
app-server-daemon = { workspace = true }
app-server-protocol = { workspace = true }
app-server-test-client = { workspace = true }
codex-auth-types = { workspace = true }
codex-arg0 = { workspace = true }
codex-chatgpt = { workspace = true, features = ["apply-command"] }
codex-cloud-tasks = { path = "../cloud-tasks" }
codex-utils-cli = { workspace = true }
command-service = { workspace = true }
codex-config-types = { workspace = true }
thread-service = { workspace = true }
plugin-service = { workspace = true }
codex-exec = { workspace = true }
exec-server-api = { workspace = true }
codex-exec-server = { workspace = true }
permissions-service = { workspace = true }
codex-features = { workspace = true }
goal-service = { workspace = true }
codex-install-context = { workspace = true }
codex-login = { workspace = true, features = ["model-provider-auth"] }
memory-service = { workspace = true }
mcp-service = { workspace = true }
mcp-service-api = { workspace = true }
codex-mcp-server = { workspace = true }
mcp-types = { workspace = true }
model-service = { workspace = true }
model-service-api = { workspace = true }
codex-network-proxy = { workspace = true }
permissions-service-api = { workspace = true }
plugin-service-api = { workspace = true }
protocol = { workspace = true }
codex-responses-api-proxy = { workspace = true }
codex-rmcp-client = { workspace = true }
rollout = { workspace = true }
rollout-trace = { workspace = true }
codex-sandboxing = { workspace = true }
state = { workspace = true }
state-api = { workspace = true }
codex-stdio-to-uds = { workspace = true }
codex-terminal-detection = { workspace = true }
thread-service-api = { workspace = true }
thread-store = { workspace = true }
tool-config = { workspace = true }
codex-tool-service = { workspace = true }
codex-tui = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path = { workspace = true }
codex-workflow = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
