[package]
name = "codex-sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_sandboxing"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
transport-client-identity = { workspace = true }
config-service = { workspace = true }
codex-config-toml = { workspace = true }
codex-config-types = { workspace = true }
codex-features = { workspace = true }
metrics-api = { workspace = true }
codex-network-proxy-api = { workspace = true }
protocol = { workspace = true }
codex-sandboxing-api = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-string = { workspace = true }
dunce = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
regex-lite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dependencies]
codex-windows-sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs", default-features = false }

[dev-dependencies]
async-trait = { workspace = true }
config-service = { workspace = true }
codex-network-proxy = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
