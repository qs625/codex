[package]
edition.workspace = true
license.workspace = true
name = "codex-config-loader-remote"
version.workspace = true
description = "Remote thread configuration loader implementation."

[[example]]
name = "generate-proto"
path = "examples/generate-proto.rs"

[lib]
doctest = false
name = "codex_config_loader_remote"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-config-loader = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
prost = "0.14.3"
tonic = { workspace = true }
tonic-prost = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost-build = { version = "=0.14.3", default-features = false, features = ["transport"] }
